name: Mirror the community
on:
  schedule:
    - cron: '17 11 * * *'   # daily, 04:17 Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/mirror.mjs
      # a commit only when something changed; nothing to push otherwise
      - run: |
          git add -A playlists charts
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="astrolabe-music" -c user.email="actions@users.noreply.github.com" commit -m "Mirror: $(date -u +%Y-%m-%d)"
          git push
